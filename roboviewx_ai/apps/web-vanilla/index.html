<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoboViewX - Vanilla Viewer</title>
    <link rel="stylesheet" href="/src/styles.css">
</head>

<body class="min-h-screen bg-gray-900 text-white">
    <div class="max-w-4xl mx-auto p-4">
        <h1 class="text-3xl font-bold mb-6">RoboViewX - Live View (Vanilla)</h1>

        <!-- Status Bar -->
        <div class="bg-gray-800 rounded-lg p-4 mb-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div id="status-indicator" class="w-3 h-3 rounded-full bg-gray-500"></div>
                    <span id="status-text" class="font-semibold">DISCONNECTED</span>
                </div>
                <div id="peer-id" class="text-sm text-gray-400"></div>
            </div>
            <div id="error-message" class="mt-2 text-red-400 text-sm hidden"></div>
        </div>

        <!-- Controls -->
        <div class="bg-gray-800 rounded-lg p-4 mb-4">
            <div class="flex gap-4 items-end">
                <div class="flex-1">
                    <label for="room-id-input" class="block text-sm font-medium mb-2">Room ID</label>
                    <input type="text" id="room-id-input"
                        class="w-full px-4 py-2 bg-gray-700 rounded border border-gray-600 focus:border-blue-500 focus:outline-none disabled:opacity-50"
                        placeholder="robot-001" />
                </div>
                <div>
                    <button id="connect-btn"
                        class="px-6 py-2 bg-blue-600 hover:bg-blue-700 rounded font-medium transition">
                        Connect
                    </button>
                    <button id="disconnect-btn"
                        class="px-6 py-2 bg-red-600 hover:bg-red-700 rounded font-medium transition hidden">
                        Disconnect
                    </button>
                </div>
            </div>
        </div>

        <!-- Video Player & Tilt Control -->
        <div class="relative bg-black rounded-lg overflow-hidden aspect-video group">
            <video id="video-element" autoplay playsinline controls muted="false"
                class="w-full h-full object-contain"></video>

            <!-- AI person detection overlay (canvas) -->
            <canvas id="ai-overlay" class="absolute inset-0 pointer-events-none"></canvas>

            <!-- PTZ Control Overlay (collapsible) -->
            <div class="absolute top-4 right-4 flex flex-col items-end gap-2">
                <button id="ptz-toggle"
                    class="w-10 h-10 rounded-full bg-gray-900/80 hover:bg-gray-900 border border-gray-700 shadow-xl text-xs font-bold tracking-widest">
                    PTZ
                </button>

                <div id="ptz-control-panel"
                    class="bg-gray-900/90 backdrop-blur-md p-4 rounded-xl border border-gray-700 w-64 shadow-2xl transition-all duration-150 ease-out origin-top-right opacity-0 scale-95 pointer-events-none">
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-xs font-bold text-gray-400 uppercase tracking-widest">Camera PTZ</span>
                        <div id="ptz-loading-dot" class="w-2 h-2 bg-blue-500 rounded-full animate-pulse hidden"></div>
                    </div>

                <div class="space-y-4">
                    <!-- Pan -->
                    <div class="space-y-1">
                        <div class="flex justify-between text-[10px] text-gray-400">
                            <span>PAN</span>
                            <span id="pan-display" class="font-mono text-blue-400">0°</span>
                        </div>
                        <input type="range" id="pan-slider" min="-180" max="180" step="1" value="0"
                            class="w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500" />
                    </div>

                    <!-- Tilt -->
                    <div class="space-y-1">
                        <div class="flex justify-between text-[10px] text-gray-400">
                            <span>TILT</span>
                            <span id="tilt-display" class="font-mono text-blue-400">0°</span>
                        </div>
                        <input type="range" id="tilt-slider" min="-90" max="90" step="1" value="0"
                            class="w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500" />
                    </div>

                    <!-- Zoom -->
                    <div class="space-y-1">
                        <div class="flex justify-between text-[10px] text-gray-400">
                            <span>ZOOM</span>
                            <span id="zoom-display" class="font-mono text-blue-400">1.0x</span>
                        </div>
                        <input type="range" id="zoom-slider" min="1.0" max="3.0" step="0.1" value="1.0"
                            class="w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500" />
                    </div>
                </div>

                    <div id="ptz-status" class="mt-3 text-[10px] text-gray-500 text-center italic">Initializing...</div>
                </div>
            </div>
        </div>

        <!-- Info -->
        <div class="mt-4 text-sm text-gray-400">
            <p id="signaling-url-info">Signaling Server: Loading...</p>
            <p id="stream-status-info" class="mt-1">Status: No video</p>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
